<!DOCTYPE html>
<html>
<head>
    <title>Order Successful</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>✅ Order Placed Successfully!</h1>

    {% for item in cart %}
        <p>{{ item.name }} - ₹{{ item.price }}</p>
    {% endfor %}

    <h2>Total Paid: ₹{{ total }}</h2>

    <a href="/">
        <button>Back to Menu</button>
    </a>
</div>

</body>
</html>
